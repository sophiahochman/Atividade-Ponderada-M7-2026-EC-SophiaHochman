<path d="M405 380 H1105 L1125 360 M1105 380 V725" fill="none" stroke="#496079" stroke-width="2"/>
<text x="430" y="414" font-size="17">«executionEnvironment»</text>
<text x="430" y="445" font-size="22" font-weight="bold">Docker · serviço api</text><rect x="680" y="485" width="380" height="205" fill="#ffe5ee" stroke="#496079" stroke-width="2"/>
<text x="696" y="515" font-size="16">«component»</text>
<text x="696" y="546" font-size="21" font-weight="bold">Backend FastAPI</text>
<path d="M1027,498 h19 v27 h-19 z M1022,503 h10 v6 h-10 z M1022,514 h10 v6 h-10 z" fill="#fff" stroke="#496079" stroke-width="1.5"/>
<line x1="680" y1="562" x2="1060" y2="562" stroke="#496079"/><text x="696" y="593" font-size="17">api/main.py · Python</text><text x="696" y="620" font-size="17">carrega e confere os artefatos</text><text x="696" y="647" font-size="17">GET /health · POST /predict</text><text x="696" y="674" font-size="17">retorna previsão e moeda</text><rect x="35" y="485" width="270" height="205" fill="#f0f2f5" stroke="#496079" stroke-width="2"/>
<text x="51" y="515" font-size="16">«component»</text>
<text x="51" y="546" font-size="21" font-weight="bold">Aplicação cliente</text>
<path d="M272,498 h19 v27 h-19 z M267,503 h10 v6 h-10 z M267,514 h10 v6 h-10 z" fill="#fff" stroke="#496079" stroke-width="1.5"/>
<line x1="35" y1="562" x2="305" y2="562" stroke="#496079"/><text x="51" y="593" font-size="17">Swagger UI / curl</text><text x="51" y="620" font-size="17">PowerShell / Postman</text><text x="51" y="647" font-size="17">requisição e resposta HTTP</text><path d="M1220 460 H1160 V590 H1060" fill="none" stroke="#26344b" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="1330" y="595" text-anchor="middle" font-size="16">volume artifacts:ro</text><path d="M305 548 H680" fill="none" stroke="#26344b" stroke-width="2"  marker-end="url(#arrow)"/><text x="490" y="534" text-anchor="middle" font-size="16">solicitação HTTP + JSON</text><path d="M680 638 H305" fill="none" stroke="#26344b" stroke-width="2"  marker-end="url(#arrow)"/><text x="490" y="624" text-anchor="middle" font-size="16">resposta JSON · previsão</text><text x="40" y="767" font-size="16">As setas indicam o fluxo dos dados. O backend usa o artefato já treinado; o treinamento é executado separadamente.</text></g></svg>
